apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: portal-mariadb-data
  namespace: portal-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-mariadb
  namespace: portal-system
  labels:
    app: portal-mariadb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portal-mariadb
  template:
    metadata:
      labels:
        app: portal-mariadb
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.5
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_RANDOM_ROOT_PASSWORD
              value: "yes"
            - name: MYSQL_DATABASE
              value: portal_db
            - name: MYSQL_USER
              value: portal_user
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: portal-db-secret
                  key: db-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: portal-mariadb-data
