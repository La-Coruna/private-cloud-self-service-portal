apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portal-demo
  namespace: portal-system
spec:
  ingressClassName: nginx
  rules:
    - host: portal.la-coruna.xyz
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: portal-backend
                port:
                  number: 8000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: portal-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portal-frontend
                port:
                  number: 80