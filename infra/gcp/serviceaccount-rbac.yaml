apiVersion: v1
kind: ServiceAccount
metadata:
  name: portal-backend
  namespace: portal-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: portal-backend-demo-manager
rules:
  - apiGroups: [""]
    resources: ["namespaces", "resourcequotas", "services", "pods", "events"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: portal-backend-demo-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: portal-backend-demo-manager
subjects:
  - kind: ServiceAccount
    name: portal-backend
    namespace: portal-system
